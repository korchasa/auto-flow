name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Manual release. `auto` keeps the commit-driven decision; the explicit
  # levels exist to correct a version number without inventing a commit.
  workflow_dispatch:
    inputs:
      release_as:
        description: "Release level (auto = decide from the commits)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

# Default permissions cover check (tag push) and publish-github
# (release create). publish-jsr overrides with id-token: write for
# OIDC trusted publishing and downgrades contents to read-only.
permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run checks
        run: deno task check

      - name: Verify JSR publish of @korchasa/flowai-workflow (dry-run)
        run: deno publish --dry-run --allow-dirty

      - name: Verify no files modified by check
        run: |
          if ! git diff --exit-code; then
            echo "::error::Check modified files — commit these changes"
            git diff --stat
            exit 1
          fi

  plugin-install-acceptance-claude:
    name: Plugin install acceptance (Claude Code)
    needs: check
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.158

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Install Claude Code CLI
        run: |
          set -euo pipefail
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Install flowai-workflow CLI on PATH (FR-E78 precondition)
        run: |
          set -euo pipefail
          # --minimum-dependency-age=0 disables the Deno 2.8 supply-chain
          # delay so freshly-tagged ai-ide-cli versions are accepted
          # against the source `deno.json` (locked via `deno.lock`).
          deno install -A -g -f -n flowai-workflow \
            --config ./deno.json \
            --minimum-dependency-age=0 \
            ./src/cli.ts
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/flowai-workflow" --version

      - name: Run Claude Code install acceptance
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # --agent-evidence-optional: install + MCP probe stay blocking; the
          # nondeterministic live-agent step is reported but does not fail CI.
          deno run -A scripts/plugin-install-acceptance.ts \
            --host claude \
            --agent-evidence-optional

  plugin-install-acceptance-codex:
    name: Plugin install acceptance (Codex)
    needs: check
    runs-on: ubuntu-latest
    env:
      CODEX_CLI_VERSION: 0.135.0
      # Reasoning model — far more reliable at issuing the get_workflow MCP
      # tool call than gpt-4.1 (which often substitutes a resource-read).
      CODEX_INSTALL_ACCEPTANCE_MODEL: openai/gpt-5-mini

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          npm install -g "@openai/codex@${CODEX_CLI_VERSION}"
          codex --version

      - name: Install flowai-workflow CLI on PATH (FR-E78 precondition)
        run: |
          set -euo pipefail
          # --minimum-dependency-age=0 disables the Deno 2.8 supply-chain
          # delay so freshly-tagged ai-ide-cli versions are accepted
          # against the source `deno.json` (locked via `deno.lock`).
          deno install -A -g -f -n flowai-workflow \
            --config ./deno.json \
            --minimum-dependency-age=0 \
            ./src/cli.ts
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/flowai-workflow" --version

      - name: Run Codex install acceptance
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # --agent-evidence-optional: install + MCP probe stay blocking; the
          # nondeterministic live-agent step is reported but does not fail CI.
          deno run -A scripts/plugin-install-acceptance.ts \
            --host codex \
            --codex-provider openrouter \
            --agent-evidence-optional

  release:
    name: Release
    needs: [
      check,
      plugin-install-acceptance-claude,
      plugin-install-acceptance-codex,
    ]
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.create-release.outputs.released }}
      tag: ${{ steps.create-release.outputs.tag }}
      version: ${{ steps.create-release.outputs.version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Create release and push tags
        id: create-release
        if: |
          (github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !contains(github.event.head_commit.message, 'chore(release):')) ||
          github.event_name == 'workflow_dispatch'
        env:
          RELEASE_AS: ${{ inputs.release_as }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # The bump level is decided by scripts/release-level.ts and forced
          # with --release-as. commit-and-tag-version must NOT decide it: while
          # the version is 0.x the tool treats a feat as a patch, which is how
          # FR-E99 shipped as 0.9.2 instead of 0.10.0. The script reads every
          # commit of the range (a merge commit carries no type of its own) and
          # keeps the rules under test in scripts/release-level_test.ts.
          if [ -n "$RELEASE_AS" ] && [ "$RELEASE_AS" != "auto" ]; then
            LEVEL="$RELEASE_AS"
          elif [ -z "$LATEST_TAG" ]; then
            LEVEL=$(deno run -A scripts/release-level.ts)
          else
            LEVEL=$(deno run -A scripts/release-level.ts "${LATEST_TAG}..HEAD")
          fi
          echo "Release level: ${LEVEL} (tag: ${LATEST_TAG:-none})"

          if [ "$LEVEL" != "none" ]; then
            deno task release --release-as "$LEVEL"
            NEW_VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
            NEW_TAG="v${NEW_VERSION}"
            git tag -a "$NEW_TAG" -m "Release ${NEW_TAG}"
            git push origin main "$NEW_TAG"

            echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "tag=${NEW_TAG}" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "Nothing to release"
            echo "released=false" >> $GITHUB_OUTPUT
          fi

  # Reads scripts/targets.json (single source of truth, also consumed by
  # scripts/compile.ts) and emits a GitHub Actions matrix. Keeping the list
  # in one file prevents drift between the local compile script and CI.
  setup-matrix:
    name: Resolve build matrix
    needs: release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.released == 'true' && needs.release.outputs.tag || github.sha }}

      - name: Build matrix from scripts/targets.json
        id: targets
        run: echo "matrix=$(jq -c . scripts/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: [release, setup-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.released == 'true' && needs.release.outputs.tag || github.sha }}

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Compile
        env:
          VERSION: ${{ needs.release.outputs.released == 'true' && needs.release.outputs.tag || 'dev' }}
        run: deno task compile --target ${{ matrix.target }}

      # FR-E78: emit a sha256 sidecar so operators can verify the release
      # binary before placing it on PATH. The single `dist/*` glob in
      # publish-github picks both files up; no extra release-attach step.
      - name: Generate sha256 sidecar
        if: needs.release.outputs.released == 'true'
        run: sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: needs.release.outputs.released == 'true'
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  # Inline sync of the plugin payload to korchasa/flowai-workflow-plugins.
  # GITHUB_TOKEN-pushed tags don't trigger downstream workflows (recursion
  # guard), so sync-plugins.yml's `push: tags: ['v*']` trigger never fires
  # for CI-created releases — we publish directly in this workflow instead.
  # The workflow_dispatch trigger on sync-plugins.yml remains for manual
  # re-runs. Step-output interpolation is routed via env: per the
  # workflow-injection guidance (no `${{ needs.* }}` inside `run:`).
  sync-plugins:
    name: Sync plugin payload
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Sync plugin payload to flowai-workflow-plugins
        env:
          PLUGINS_REPO_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          deno run -A scripts/sync-plugins-repo.ts \
            --mode publish \
            --version "$RELEASE_VERSION"

  # Creates the GitHub Release with cross-compiled binaries attached.
  # Waits for the build matrix and plugin sync because it needs the compiled
  # artifacts and should not publish a release when the plugin sync failed.
  publish-github:
    name: Publish GitHub Release
    needs: [release, build, sync-plugins]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG="${{ needs.release.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          NOTES_FILE=$(mktemp)
          if [ -n "$PREV_TAG" ]; then
            deno run -A scripts/generate-release-notes.ts "$PREV_TAG" "$CURRENT_TAG" "${{ github.repository }}" > "$NOTES_FILE"
          else
            echo "Initial release" > "$NOTES_FILE"
          fi
          echo "notes_file=${NOTES_FILE}" >> $GITHUB_OUTPUT

      - name: Create release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # dist/ contains only files produced by the matrixed build job
        # (download-artifact with merge-multiple flattens artifacts into
        # dist/). Using a glob removes the last hardcoded copy of the
        # target list — the matrix itself is derived from targets.json.
        run: |
          gh release create "${{ needs.release.outputs.tag }}" \
            --title "flowai-workflow ${{ needs.release.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            dist/*

  # Publishes the TypeScript package to JSR after the real plugin acceptance
  # checks, cross-platform build, and plugin sync have passed.
  publish-jsr:
    name: Publish to JSR
    needs: [release, build, sync-plugins]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Only id-token is needed for OIDC trusted publishing.
      # contents: read is for checkout.
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      # @korchasa/ai-ide-cli is maintained in korchasa/ai-ide-cli and
      # published from there. Engine imports the stable JSR version.
      - name: Publish @korchasa/flowai-workflow to JSR
        run: deno publish
