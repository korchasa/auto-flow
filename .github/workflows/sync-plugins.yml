name: Sync plugins repo

# FR-E72: On every engine version tag (vX.Y.Z), build the Claude Code /
# Codex plugin payload from this repo and push it into
# korchasa/flowai-workflow-plugins. The downstream repo is autogenerated;
# do not edit it by hand — changes there are overwritten by the next sync.
#
# Prerequisites (one-time, manual):
#   1. Create the public repo korchasa/flowai-workflow-plugins (MIT, empty main).
#   2. Generate a PAT with `contents:write` on that repo.
#   3. Store the PAT in this repo's Actions secrets as PLUGINS_REPO_TOKEN.
#
# Until those are in place the job will fail on `git clone`. The
# workflow_dispatch trigger lets the maintainer test the full flow
# manually after every prerequisite step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to deno.json#version)"
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: Build payload and push to flowai-workflow-plugins
    runs-on: ubuntu-latest
    env:
      # Untrusted inputs / secrets routed via env to prevent shell-injection
      # via ${{ … }} interpolation inside `run:`.
      INPUT_VERSION: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
      PLUGINS_REPO_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Resolve target version
        id: ver
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync plugin payload to korchasa/flowai-workflow-plugins
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          deno run -A scripts/sync-plugins-repo.ts \
            --mode publish \
            --engine-root . \
            --version "$VERSION"

      - name: Payload-integrity smoke (clone downstream, deno run --version)
        run: |
          # NOTE: this verifies the payload runs under Deno, NOT that
          # `claude plugin install` works end-to-end. Full marketplace
          # install is a manual checklist item (see FR-E72) — GH Actions
          # runners do not ship the `claude` CLI.
          set -euo pipefail
          TMP_DIR=$(mktemp -d)
          git clone --depth=1 \
            "https://x-access-token:${PLUGINS_REPO_TOKEN}@github.com/korchasa/flowai-workflow-plugins.git" \
            "$TMP_DIR"
          FLOWAI_SUPPRESS_DEPRECATION=1 \
            deno run -A \
              "$TMP_DIR/plugins/flowai-workflow/engine/cli.ts" \
              --version
