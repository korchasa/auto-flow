name: Sync plugins repo

# FR-E72: On every engine version tag (vX.Y.Z), build the Claude Code /
# Codex plugin payload from this repo and push it into
# korchasa/flowai-workflow-plugins. The downstream repo is autogenerated;
# do not edit it by hand — changes there are overwritten by the next sync.
#
# Prerequisites (one-time, manual):
#   1. Create the public repo korchasa/flowai-workflow-plugins (MIT, empty main).
#   2. Generate a PAT with `contents:write` on that repo.
#   3. Store the PAT in this repo's Actions secrets as PLUGINS_REPO_TOKEN.
#
# Until those are in place the job will fail on `git clone`. The
# workflow_dispatch trigger lets the maintainer test the full flow
# manually after every prerequisite step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to deno.json#version)"
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: Build payload and push to flowai-workflow-plugins
    runs-on: ubuntu-latest
    env:
      # Untrusted inputs / secrets routed via env to prevent shell-injection
      # via ${{ … }} interpolation inside `run:`.
      INPUT_VERSION: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
      PLUGINS_REPO_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Install host CLIs for plugin acceptance
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code @openai/codex
          claude --version
          codex --version

      - name: Resolve target version
        id: ver
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Unit-test plugin install acceptance
        run: deno task test scripts/plugin-install-acceptance_test.ts

      - name: Pre-publish official install acceptance
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_INSTALL_ACCEPTANCE_MODEL: openai/gpt-4.1
        run: |
          set -euo pipefail
          TMP_DIR=$(mktemp -d)
          deno run -A scripts/build-plugin-payload.ts \
            --engine-root . \
            --version "$VERSION" \
            --out-dir "$TMP_DIR"
          deno run -A scripts/plugin-payload-smoke.ts "$TMP_DIR"
          deno run -A scripts/plugin-install-acceptance.ts \
            --payload-dir "$TMP_DIR" \
            --host all \
            --codex-provider openrouter

      - name: Sync plugin payload to korchasa/flowai-workflow-plugins
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          deno run -A scripts/sync-plugins-repo.ts \
            --mode publish \
            --engine-root . \
            --version "$VERSION"

      - name: Post-publish downstream install acceptance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_INSTALL_ACCEPTANCE_MODEL: openai/gpt-4.1
        run: |
          set -euo pipefail
          TMP_DIR=$(mktemp -d)
          git clone --depth=1 \
            "https://x-access-token:${PLUGINS_REPO_TOKEN}@github.com/korchasa/flowai-workflow-plugins.git" \
            "$TMP_DIR"
          deno run -A scripts/plugin-payload-smoke.ts "$TMP_DIR"
          deno run -A scripts/plugin-install-acceptance.ts \
            --payload-dir "$TMP_DIR" \
            --host all \
            --codex-provider openrouter
